services:
  redpanda:
    image: redpandadata/redpanda:v23.3.5
    command:
      - redpanda start
      - --smp 2
      - --overprovisioned
      - --node-id 0
      - --kafka-addr PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9093
      - --advertise-kafka-addr PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9093
      - --memory 4G
    ports:
      - "9093:9093"
      - "29092:29092"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    networks:
      - kafka-network
    deploy:
      resources:
        limits:
          memory: 6G
        reservations:
          memory: 3G

  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v2.3.1
    ports:
      - "8081:8080"
    environment:
      - KAFKA_BROKERS=redpanda:29092
    depends_on:
      - redpanda
    networks:
      - kafka-network

  mongodb:
    image: mongo:6.0
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
      - ./config/mongodb:/docker-entrypoint-initdb.d
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USERNAME:-mongodb_user}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD:-mongodb_password}
      - MONGO_INITDB_DATABASE=social_media
    networks:
      - kafka-network
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 15s
      timeout: 10s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

  cassandra:
    image: cassandra:4.1
    ports:
      - "9042:9042"
    volumes:
      - cassandra-data:/var/lib/cassandra
    environment:
      - CASSANDRA_CLUSTER_NAME=market_data_cluster
      - CASSANDRA_ENDPOINT_SNITCH=SimpleSnitch
      - CASSANDRA_DC=datacenter1
      - MAX_HEAP_SIZE=2G
      - HEAP_NEWSIZE=512M
      - JVM_OPTS=-Xms1G -Xmx2G -Dcassandra.jmx.local.port=7199
    networks:
      - kafka-network
    healthcheck:
      test: [ "CMD", "cqlsh", "-e", "describe keyspaces" ]
      interval: 15s
      timeout: 10s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G

  cassandra-init:
    image: cassandra:4.1
    volumes:
      - ./config/cassandra:/config/cassandra
    command: >
      bash -c "
        echo 'Waiting for Cassandra to start...' &&
        until cqlsh cassandra -e 'describe keyspaces'; do
          echo 'Cassandra not ready yet - retrying...';
          sleep 5;
        done &&
        echo 'Initializing Cassandra schema from schema.cql...' &&
        cqlsh cassandra -f /config/cassandra/schema.cql &&
        echo 'Schema initialization complete!'
      "
    networks:
      - kafka-network
    depends_on:
      cassandra:
        condition: service_healthy

  redis:
    image: redis:7.2
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    networks:
      - kafka-network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 15s
      timeout: 10s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  spark:
    build:
      context: ./
      dockerfile: ./docker/spark/Dockerfile
    ports:
      - "8090:8080"  # Spark UI
      - "7077:7077"  # Spark master port
      - "4040:4040"  # Application UI
    volumes:
      - ./src:/opt/bitnami/spark/src
      - ./config:/opt/bitnami/spark/config
      - ./scripts:/opt/bitnami/spark/scripts
      - ./logs/spark:/opt/bitnami/spark/logs
      - ./models:/opt/bitnami/spark/models
      - spark-volume:/bitnami
    environment:
      - SPARK_MODE=master
      - KAFKA_BOOTSTRAP_SERVERS=redpanda:29092
      - MONGODB_HOST=mongodb
      - MONGODB_PORT=27017
      - CASSANDRA_HOST=cassandra
      - CASSANDRA_PORT=9042
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - HF_HOME=/opt/bitnami/spark/models/cache
    networks:
      - kafka-network
    depends_on:
      - redpanda
      - mongodb
      - redis
      - cassandra
    user: root  # Ensure we're running as root
    command: >
      bash -c "echo 'Spark is ready!' && tail -f /dev/null"
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 4G


  redisinsight:
    image: redislabs/redisinsight:1.14.0
    ports:
      - "5540:5540"
    networks:
      - kafka-network
    depends_on:
      - redis


volumes:
  redpanda-data:
  spark-volume:
  mongodb-data:
  redis-data:
  grafana-data:
  spark-cache:
  cassandra-data:

networks:
  kafka-network:
    driver: bridge